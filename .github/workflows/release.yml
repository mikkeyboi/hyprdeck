name: Release

# Builds and publishes a stable release for a `vX.Y.Z` tag. Runs when a
# maintainer pushes a tag, and is called by the weekly workflow (tags pushed with
# GITHUB_TOKEN don't trigger workflows, so it calls this one directly).
on:
  push:
    tags: ["v[0-9]*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) that already exists on the remote
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: Build and publish AppImage
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install toolchain and packaging tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita dbus hyprland \
            glib2 file desktop-file-utils appstream squashfs-tools zsync github-cli
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Prepare
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag $TAG"; exit 1; }
          echo "HYPRDECK_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked
      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/Hyprdeck-x86_64.AppImage dist/Hyprdeck-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Hyprdeck $TAG" --generate-notes --verify-tag --latest
