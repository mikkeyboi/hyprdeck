name: Release

# Builds and publishes a stable release for a `vX.Y.Z` tag. Runs when a
# maintainer pushes a tag, and is called by the weekly workflow with the tag to
# create and the commit to release.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to create
        required: true
        type: string
      sha:
        description: Commit to release (the tag is created there)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: Build and publish AppImage
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Install toolchain and packaging tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita dbus hyprland \
            glib2 file desktop-file-utils appstream squashfs-tools zsync github-cli
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Prepare
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag $TAG"; exit 1; }
          echo "HYPRDECK_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --locked
      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag at $SHA when it doesn't exist yet (weekly releases).
          gh release create "$TAG" dist/Hyprdeck-x86_64.AppImage dist/Hyprdeck-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Hyprdeck $TAG" --generate-notes --latest
